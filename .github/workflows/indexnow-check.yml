name: IndexNow Cron Check

on:
  schedule:
    # Run every 6 hours (at minute 0 of hour 0, 6, 12, 18)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  indexnow:
    name: Check and Submit to IndexNow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run IndexNow check script
        run: |
          chmod +x scripts/indexnow_check.py
          python scripts/indexnow_check.py
